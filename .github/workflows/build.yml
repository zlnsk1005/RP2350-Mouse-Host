name: Build RP2350 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi build-essential git python3

    - name: Clone Pico SDK master
      run: |
        git clone --depth 1 \
          https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --depth 1 \
          lib/btstack lib/cyw43-driver lib/lwip lib/mbedtls

    - name: Clone TinyUSB master
      run: |
        git clone --depth 1 \
          https://github.com/hathach/tinyusb.git pico-sdk/lib/tinyusb

    - name: Clone Pico-PIO-USB
      run: |
        git clone --depth 1 \
          https://github.com/sekigon-gonnoc/Pico-PIO-USB.git
        cp -r Pico-PIO-USB/src/* pico-sdk/lib/tinyusb/hw/bsp/rp2040/

    - name: Build firmware
      run: |
        export PICO_SDK_PATH=$PWD/pico-sdk
        export PICO_PIO_USB_PATH=$PWD/Pico-PIO-USB
        mkdir build && cd build
        cmake .. -DPICO_BOARD=pico2 \
                 -DPICO_PLATFORM=rp2350-arm-s
        make -j4

    - name: Upload .uf2
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: build/**/*.uf2
