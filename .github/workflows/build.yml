name: Build RP2350 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi build-essential git python3

    - name: Clone Pico SDK 2.1.0
      run: |
        git clone --branch 2.1.0 --depth 1 \
          https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --depth 1

    - name: Clone TinyUSB compatível
      run: |
        git clone --branch 0.17.0 --depth 1 \
          https://github.com/hathach/tinyusb.git tinyusb

    - name: Build firmware
      run: |
        export PICO_SDK_PATH=$PWD/pico-sdk
        mkdir build && cd build
        cmake .. -DBOARD=rp2350-usb-a -DFAMILY=rp2040 \
          -DPICO_SDK_PATH=$PICO_SDK_PATH
        make -j4

    - name: Upload .uf2
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: build/**/*.uf2
