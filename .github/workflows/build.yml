name: Build RP2350 Firmware
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
        
    - name: Clone SDK & PIO-USB
      run: |
        git clone --depth 1 https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init --depth 1 lib/tinyusb
        cd ..
        git clone --depth 1 https://github.com/sekigon-gonnoc/Pico-PIO-USB.git
        
    - name: Fix Configs (Ligar Debug e Bypass RP2040)
      run: |
        sed -i 's/#define USE_CDC 0/#define USE_CDC 1/g' src/tusb_config.h
        sed -i 's/#if CFG_TUSB_MCU == OPT_MCU_RP2040/#if 1/g' src/tusb_config.h
        
    - name: Setup CMakeLists
      run: |
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.17)
        
        # A VARIÁVEL MÁGICA OFICIAL DO PICO SDK!
        set(PICO_TINYUSB_PIO_USB_HOST 1)
        
        # Pinos oficiais da RP2350-USB-A
        add_compile_definitions(
            PICO_DEFAULT_PIO_USB_DP_PIN=16
            PICO_DEFAULT_PIO_USB_VBUSEN_STATE=1
        )
        
        include($ENV{PICO_SDK_PATH}/external/pico_sdk_import.cmake)
        project(rp2350_mouse_host C CXX ASM)
        pico_sdk_init()
        
        add_executable(rp2350_mouse_host src/main.c src/usb_descriptors.c src/hid_reports.c)
        target_include_directories(rp2350_mouse_host PRIVATE src)
        
        target_link_libraries(rp2350_mouse_host PRIVATE
            pico_stdlib
            pico_multicore
            tinyusb_device
            tinyusb_host
            tinyusb_board
        )
        pico_add_extra_outputs(rp2350_mouse_host)
        EOF
        
    - name: Build firmware
      run: |
        export PICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
        mkdir build && cd build
        cmake .. -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s -DPIO_USB_PATH=$GITHUB_WORKSPACE/Pico-PIO-USB
        make -j$(nproc)
        
    - name: Upload .uf2
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: build/*.uf2
