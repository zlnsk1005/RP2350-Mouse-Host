name: Build RP2350 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi build-essential git python3

    - name: Clone Pico SDK 2.0
      run: |
        git clone --branch 2.0.0 --depth 1 \
          https://github.com/raspberrypi/pico-sdk.git
        cd pico-sdk
        git submodule update --init

    - name: Build firmware
      run: |
        export PICO_SDK_PATH=$PWD/pico-sdk
        mkdir build && cd build
        cmake .. -DPICO_BOARD=rp2350
        make -j4

    - name: Upload .uf2
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: build/**/*.uf2
