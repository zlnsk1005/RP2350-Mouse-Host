name: Build RP2350 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gcc-arm-none-eabi \
          libnewlib-arm-none-eabi build-essential git python3

    - name: Clone TinyUSB
      run: |
        git clone --depth 1 https://github.com/hathach/tinyusb.git tinyusb
        cd tinyusb
        python3 tools/get_deps.py rp2350-usb-a

    - name: Build firmware
      run: |
        mkdir build && cd build
        cmake .. -DBOARD=rp2350-usb-a -DFAMILY=rp2040
        make -j4

    - name: Upload .uf2
      uses: actions/upload-artifact@v4
      with:
        name: firmware-rp2350
        path: build/**/*.uf2
